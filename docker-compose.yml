name: fraud-detection

services:

  postgres:
    image: postgres:18-alpine
    container_name: fraud-postgres
    environment:
      # Read only on first initialisation. Once the volume has data,
      # changing on these has no effect.
      POSTGRES_DB: frauddb
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
    ports:
      - "5432:5432"
    volumes:
      # PG18+ moved the mount point here from /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    labels:
      org.springframework.boot.ignore: "true"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d frauddb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s   # first initdb is slow; failures here don't count

  redis:
    image: redis:8-alpine
    container_name: fraud-redis
    # Both persistence modes off: this is a disposable counter store,
    # not a system of record.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    labels:
      org.springframework.boot.ignore: "true"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:4.1.2
    container_name: fraud-kafka
    ports:
      - "29092:29092"   # host-facing listener; 9092 and 9093 stay container-internal
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners on different ports. One address cannot be correct for both
      # the host and the compose network, because "localhost" means a different
      # machine in each.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,HOST://0.0.0.0:29092, CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Internal topics default to 3 replicas; a single broker can't start
      # until these drop to 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0   # default 3000ms is pure waiting in dev
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"     # temporary; Phase 1 uses NewTopic beans
    labels:
      org.springframework.boot.ignore: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s   # KRaft formats its storage on first boot

  app:
    build: .
    container_name: fraud-app
    ports:
      - "8080:8080"
    depends_on:
      # service_healthy, not just "started": Postgres accepts TCP before initdb
      # finishes, and the app exits if its first connection fails.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Relaxed binding: these override application.yml without editing it.
      # Service names, not localhost — inside the compose network localhost is this container.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/frauddb
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # spring-boot-docker-compose is a runtime dependency baked into the jar.
      # Inside the container there is no compose file and no Docker client.
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      # :? makes `docker compose up` fail loudly instead of starting a broken container.
      JWT_SECRET: ${JWT_SECRET:?set it in .env, see .env.example}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set it in .env}
      SEED_ANALYST_PASSWORD: ${SEED_ANALYST_PASSWORD:?set it in .env}
    labels:
      org.springframework.boot.ignore: "true"

volumes:
  pgdata:
