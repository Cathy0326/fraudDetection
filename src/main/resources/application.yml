spring:
  application:
    name: fraud-detection

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: fraud-detection
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.cathy.frauddetection.transaction

  docker:
    compose:
      # Start the containers on app startup, but leave them running when the
      # app stops. The default would stop them, forcing a cold Postgres start
      # on every run.
      lifecycle-management: start-only

  datasource:
    # localhost, not "postgres": the app runs on the host, outside the
    # compose network, so it goes through the published port.
    url: jdbc:postgresql://localhost:5432/frauddb
    username: fraud
    password: fraud

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate may only verify that entities match
      # the tables, and fails startup if they don't.
      ddl-auto: validate
    # Closes the database session when the request handler returns, instead of
    # holding it open for the whole HTTP request.
    open-in-view: false

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      # spring.data.redis, NOT spring.redis. Boot 2.x used the shorter prefix;
      # Boot 3 moved it. An unknown property is silently ignored and the client
      # falls back to localhost:6379 — which works here and hides the mistake.
      host: localhost
      port: 6379
      # Lettuce defaults to a 60s command timeout. Scoring is on the synchronous
      # consumer path: waiting 60s is failing, just slower and harder to locate.
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        # Actuator exposes only /health by default over HTTP; this is explicit.
        include: health
  endpoint:
    health:
      # Shows per-component status (db, diskSpace). Development only —
      # this leaks infrastructure detail if exposed publicly.
      show-details: always

logging:
  level:
    com.cathy.frauddetection: DEBUG

fraud:
  rules:
    # Selects the RuleEvaluator implementation: simple | drools.
    # Both implementations are always on the classpath; only one is created.
    engine: drools

  velocity:
    # Duration, not a bare number: "1h" carries its unit in the type.
    # Drop this to 30s to demonstrate the rule without waiting an hour.
    window: 1h
    # The number of transactions ALLOWED in the window. The rule fires on
    # count > limit, so the 4th transaction in the window is the first hit.
    limit: 3